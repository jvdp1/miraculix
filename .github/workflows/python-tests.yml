name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ gfortran libblas-dev liblapack-dev make

      - name: Version of gcc
        run: gcc --version

      - name: Install Python test dependencies
        run: python -m pip install numpy pytest

      - name: Build CPU shared library
        run: make -C src/miraculix -f ../Makefile_miraculix COMPILER=gcc CUDA=false shared_lib

      - name: Run Python tests
        run: |
          test -f src/miraculix/miraculix.so
          python -m pytest -q src/bindings/Python/tests
